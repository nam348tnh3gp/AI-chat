<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#1a73e8">
  <title>Gemini Advanced Chat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

  <aside class="sidebar" id="sidebar" aria-label="Sidebar">
    <div class="sidebar-header">
      <h2><span class="logo-dot"></span>Gemini</h2>
      <button id="closeSidebarBtn" class="icon-btn only-mobile" title="Đóng">
        <i class="material-icons">close</i>
      </button>
    </div>

    <div class="sidebar-body">
      <button id="newChatBtn" class="new-chat-btn">
        <i class="material-icons">add</i> Cuộc trò chuyện mới
      </button>

      <div class="search-box">
        <i class="material-icons">search</i>
        <input id="searchChats" type="text" placeholder="Tìm kiếm cuộc trò chuyện…" autocomplete="off">
      </div>

      <div class="chat-history-list" id="chatHistoryList"></div>
    </div>

    <div class="sidebar-footer">
      <button id="importChatBtn" class="footer-btn" title="Import JSON">
        <i class="material-icons">upload_file</i> Import
      </button>
      <button id="exportChatBtn" class="footer-btn" title="Export JSON">
        <i class="material-icons">download</i> Export
      </button>
      <button id="clearHistoryBtn" class="footer-btn danger" title="Xoá tất cả">
        <i class="material-icons">delete_sweep</i> Xoá tất cả
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="chat-header">
      <button id="menuToggle" class="icon-btn menu-toggle" title="Menu">
        <i class="material-icons">menu</i>
      </button>

      <div class="model-selector" title="Chọn model">
        <i class="material-icons">smart_toy</i>
        <select id="modelSelect" aria-label="Chọn model"></select>
      </div>

      <div class="header-actions">
        <button id="themeToggle" class="icon-btn" title="Đổi giao diện">
          <i class="material-icons">dark_mode</i>
        </button>
        <button id="clearChatBtn" class="icon-btn" title="Xoá cuộc trò chuyện hiện tại">
          <i class="material-icons">cleaning_services</i>
        </button>
      </div>
    </header>

    <div class="messages-container" id="messagesContainer" role="log" aria-live="polite"></div>

    <button class="scroll-bottom-btn" id="scrollBottomBtn" title="Xuống cuối" aria-label="Scroll to bottom">
      <i class="material-icons">arrow_downward</i>
    </button>

    <div class="input-area">
      <div class="input-container">
        <textarea id="userInput" rows="1" placeholder="Nhập tin nhắn… (Enter để gửi, Shift+Enter xuống dòng)" aria-label="Tin nhắn"></textarea>
        <button id="sendBtn" class="send-btn" title="Gửi" aria-label="Gửi">
          <i class="material-icons">send</i>
        </button>
      </div>
      <div class="input-footer">
        <span id="modelStatus" class="model-status"></span>
        <button id="stopStreamBtn" class="stop-btn" style="display:none;">
          <i class="material-icons">stop_circle</i> Dừng
        </button>
      </div>
    </div>
  </main>
</div>

<div id="toastContainer" class="toast-container" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<script src="script.js"></script>
</body>
</html>
